name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUST_VERSION: "1.88"

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: litewire.exe
            archive: zip
            builder: cargo

          # Linux - musl only
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: litewire
            archive: tar.gz
            builder: cross

          - name: linux-aarch64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: litewire
            archive: tar.gz
            builder: cross

          # macOS
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: litewire
            archive: tar.gz
            builder: cargo

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: litewire
            archive: tar.gz
            builder: cargo

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        if: matrix.builder == 'cargo'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup Rust
        if: matrix.builder == 'cross'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cross
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cargo
        if: matrix.builder == 'cargo'
        run: cargo build --release --package litewire --target "${{ matrix.target }}" --features "cli,postgres,tds"

      - name: Build with cross
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          cross build \
            --release \
            --package litewire \
            --target "${{ matrix.target }}" \
            --features "cli,postgres,tds"

      - name: Prepare distribution
        shell: bash
        run: |
          set -e

          mkdir -p dist

          cp \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "dist/${{ matrix.binary }}"

          echo "Binary:"
          ls -lh "dist/${{ matrix.binary }}"

      - name: Check Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          file "dist/${{ matrix.binary }}"

          echo
          echo "Dynamic dependencies:"
          ldd "dist/${{ matrix.binary }}" || true

      - name: Create tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -e

          archive="litewire-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"

          tar -czf "$archive" \
            -C dist \
            "${{ matrix.binary }}"

          echo "Created:"
          ls -lh "$archive"

      - name: Create zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "litewire-${{ github.ref_name }}-${{ matrix.name }}.zip"

          Compress-Archive `
            -Path "dist/${{ matrix.binary }}" `
            -DestinationPath $archive

          Write-Host "Created:"
          Get-Item $archive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: litewire-${{ matrix.name }}
          path: |
            litewire-*.tar.gz
            litewire-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Release files:"
          ls -lah artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: |
          set -e

          sha256sum \
            *.tar.gz \
            *.zip \
            > checksums.txt

          echo
          echo "SHA256:"
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
