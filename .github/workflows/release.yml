name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: litewire.exe
            archive: zip

          # Linux x86_64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: litewire
            archive: tar.gz

          # Linux ARM64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: litewire
            archive: tar.gz

          # macOS x86_64
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: litewire
            archive: tar.gz

          # macOS ARM64
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: litewire
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ------------------------------------------------------------
      # Build
      #
      # Do not use "\" line continuation here.
      # GitHub Windows runner uses PowerShell by default.
      # ------------------------------------------------------------
      - name: Build
        run: cargo build --release --package litewire --target "${{ matrix.target }}" --features "cli,postgres,tds"

      # ------------------------------------------------------------
      # Prepare distribution directory
      # ------------------------------------------------------------
      - name: Prepare distribution
        shell: bash
        run: |
          set -e

          mkdir -p dist

          cp \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "dist/${{ matrix.binary }}"

      # ------------------------------------------------------------
      # Package Linux / macOS
      # ------------------------------------------------------------
      - name: Create tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -e

          archive="litewire-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"

          tar -czf "$archive" \
            -C dist \
            "${{ matrix.binary }}"

          echo "Created: $archive"

      # ------------------------------------------------------------
      # Package Windows
      # ------------------------------------------------------------
      - name: Create zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "litewire-${{ github.ref_name }}-${{ matrix.name }}.zip"

          Compress-Archive `
            -Path "dist/${{ matrix.binary }}" `
            -DestinationPath $archive

          Write-Host "Created: $archive"

      # ------------------------------------------------------------
      # Upload build artifact
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: litewire-${{ matrix.name }}
          path: |
            litewire-*.tar.gz
            litewire-*.zip
          if-no-files-found: error

  # ==================================================================
  # Create GitHub Release
  # ==================================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Download all platform artifacts
      # ------------------------------------------------------------
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # ------------------------------------------------------------
      # Show generated files
      # ------------------------------------------------------------
      - name: List artifacts
        run: |
          echo "Release files:"
          ls -lah artifacts

      # ------------------------------------------------------------
      # Generate SHA256 checksums
      # ------------------------------------------------------------
      - name: Generate checksums
        working-directory: artifacts
        run: |
          set -e

          sha256sum \
            *.tar.gz \
            *.zip \
            > checksums.txt

          echo "Checksums:"
          cat checksums.txt

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
